version: '3'
services:
  apache:
    image: httpd:2.4
    container_name: apache_server
    ports:
      - "8081:80"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8082:80"

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice_shop
    ports:
      - "3000:3000"
